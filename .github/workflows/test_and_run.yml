name: Test and Run Ikabot

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - ci-windows-docker-test

jobs:
  build:

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ endsWith(matrix.python-version, '-dev') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      if: "!endsWith(matrix.python-version, '-dev')"
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: deadsnakes/action@v1.0.0
      if: endsWith(matrix.python-version, '-dev')
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
    - name: Install Test Dependencies
      run: |
        pip install pytest
        pip install pytest-mock
    - name: Run Tests
      run: |
        python -m pytest tests/ikabot
    - name: Run ikabot
      shell: bash
      run: |
        printf "\n\n\n" | python -X faulthandler -c "import faulthandler, runpy, sys; faulthandler.dump_traceback_later(60, exit=True); sys.argv = ['ikabot']; runpy.run_module('ikabot', run_name='__main__')" &> log.log || true
        cat log.log
        grep "Obtaining new blackbox token, please wait..." log.log && exit 0 || exit 1
